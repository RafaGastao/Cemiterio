<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cemitério Online</title>

</head>
<body>
  <header>
    <div class="logo">
      <a href="#home">Cemitério Online</a>
    </div>
    <nav id="mainNav">
      <button data-route="home">Início</button>
      <button data-route="users">Usuários</button>
      <button data-route="sectors">Setores</button>
      <button data-route="dead">Usuários Falecidos</button>

    <div id="userControls" class="user-controls">

  <main id="app">
    <!-- Content injected by app.js -->
    <div class="card">
      <h2>Carregando...</h2>
    </div>

    <p>&copy; 2025 Cemitério Online. Todos os direitos reservados.</p>

      <a href="/termos-de-uso.html" target="_blank">Termos de Uso</a> |
